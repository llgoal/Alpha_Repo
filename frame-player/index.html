<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <meta name="description" content="把视频拆成一帧一帧的图片，再按帧率配着声音播放。">
  <title>Frame Studio</title>
  <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Frame Studio</div>
      <div class="server" id="serverStatus"><span class="dot"></span><span id="serverText">连接中…</span></div>
    </header>

    <section class="card key-card" id="keyCard" hidden>
      <h2>输入 Mac mini 的密钥</h2>
      <p>安装脚本最后会打印一个带 <code>#key=</code> 的链接，直接打开那个链接就行；或者把密钥粘贴到这里。</p>
      <form id="keyForm" class="row">
        <input id="keyInput" type="text" autocomplete="off" placeholder="密钥" required>
        <button class="primary" type="submit">保存</button>
      </form>
    </section>

    <section class="card new-card" id="newCard">
      <form id="newForm">
        <label class="sr-only" for="urlInput">YouTube 或视频链接</label>
        <div class="row">
          <input id="urlInput" type="url" inputmode="url" autocomplete="off" placeholder="粘贴 YouTube 链接，例如 https://youtu.be/…" required>
          <button class="primary" id="startBtn" type="submit">开始处理</button>
        </div>
        <div class="row options">
          <label>帧率
            <select id="fpsSelect">
              <option value="0" selected>和原视频一样</option>
              <option value="60">60 fps</option><option value="50">50 fps</option><option value="30">30 fps</option>
              <option value="25">25 fps</option><option value="24">24 fps</option><option value="15">15 fps</option>
              <option value="12">12 fps</option>
            </select>
          </label>
          <label>画质
            <select id="heightSelect">
              <option value="1080">1080p</option><option value="720" selected>720p</option>
              <option value="480">480p</option><option value="360">360p</option><option value="0">原始大小</option>
            </select>
          </label>
          <label class="ghost upload">上传本地视频<input id="fileInput" type="file" accept="video/*"></label>
        </div>
        <p class="note" id="newNote" hidden></p>
      </form>
    </section>

    <section class="card player-card" id="playerCard" hidden>
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="badge buffer-badge" id="bufferBadge" hidden>缓冲中…</div>
      </div>
      <div class="timeline-row">
        <span id="curTime">0:00.00</span>
        <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="进度">
        <span id="durTime">0:00.00</span>
      </div>
      <div class="controls">
        <button class="icon" id="prevBtn" title="上一帧 (←)" aria-label="上一帧">⏮</button>
        <button class="icon play" id="playBtn" title="播放/暂停 (空格)" aria-label="播放">▶</button>
        <button class="icon" id="nextBtn" title="下一帧 (→)" aria-label="下一帧">⏭</button>
        <select id="rateSelect" aria-label="速度">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button class="icon" id="muteBtn" title="静音 (M)" aria-label="静音">🔊</button>
        <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
        <span class="spacer"></span>
        <button class="icon" id="fsBtn" title="全屏 (F)" aria-label="全屏">⛶</button>
      </div>
      <div class="now">
        <strong id="nowTitle"></strong>
        <span id="nowInfo"></span>
      </div>
    </section>

    <section class="library">
      <div class="lib-head"><h2>处理过的影片</h2><span id="libInfo"></span></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="libEmpty" hidden>还没有影片。贴一个 YouTube 链接开始吧。</p>
    </section>
  </main>
  <script src="./app.js?v=3"></script>
</body>
</html>
