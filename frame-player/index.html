<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090c">
  <meta name="description" content="Turns a video into frame images and plays them back at their frame rate with sound.">
  <title>Frame Studio</title>
  <link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>Frame Studio</div>
      <div class="safe-use">Parked or passengers only</div>
      <div class="server" id="serverStatus"><span class="dot"></span><span id="serverText">Connecting…</span></div>
    </header>

    <section class="card key-card" id="keyCard" hidden>
      <h2>Enter the 8-digit PIN</h2>
      <p>On the Mac mini, run <code>cat ~/.framestudio/pin</code> to see it. Or open the link with <code>#key=</code> that the install script printed.</p>
      <form id="keyForm" class="row">
        <input id="keyInput" type="text" inputmode="numeric" autocomplete="off" placeholder="8 digits" required>
        <button class="primary" type="submit">Enter</button>
      </form>
      <p class="note error" id="keyHint" hidden></p>
    </section>

    <section class="card new-card" id="newCard">
      <form id="newForm">
        <label class="sr-only" for="urlInput">YouTube or video link</label>
        <div class="row">
          <input id="urlInput" type="url" inputmode="url" autocomplete="off" placeholder="Paste a YouTube link, e.g. https://youtu.be/…" required>
          <button class="primary" id="startBtn" type="submit">Process</button>
        </div>
        <div class="row options">
          <label>Frame rate
            <select id="fpsSelect">
              <option value="0" selected>Same as video</option>
              <option value="60">60 fps</option><option value="50">50 fps</option><option value="30">30 fps</option>
              <option value="25">25 fps</option><option value="24">24 fps</option><option value="15">15 fps</option>
              <option value="12">12 fps</option>
            </select>
          </label>
          <label>Quality
            <select id="heightSelect">
              <option value="1080">1080p</option><option value="720" selected>720p</option>
              <option value="480">480p</option><option value="360">360p</option><option value="0">Original</option>
            </select>
          </label>
          <label class="ghost upload">Upload a video<input id="fileInput" type="file" accept="video/*"></label>
        </div>
        <p class="note" id="newNote" hidden></p>
      </form>
    </section>

    <section class="card player-card" id="playerCard" hidden>
      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <div class="badge buffer-badge" id="bufferBadge" hidden>Buffering…</div>
        <div class="badge tier-badge" id="tierBadge" hidden title="The connection is slow, so smaller frames are shown">Low bandwidth</div>
      </div>
      <div class="timeline-row">
        <span id="curTime">0:00.00</span>
        <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="Position">
        <span id="durTime">0:00.00</span>
      </div>
      <div class="controls">
        <button class="ctl" id="prevBtn" title="Previous frame (←)" aria-label="Previous frame"></button>
        <button class="ctl play" id="playBtn" title="Play/pause (Space)" aria-label="Play"></button>
        <button class="ctl" id="nextBtn" title="Next frame (→)" aria-label="Next frame"></button>
        <select class="ctl rate" id="rateSelect" aria-label="Speed">
          <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option>
          <option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <span class="spacer"></span>
        <button class="ctl" id="muteBtn" title="Mute (M)" aria-label="Mute"></button>
        <button class="ctl" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen"></button>
      </div>
      <div class="now">
        <strong id="nowTitle"></strong>
        <span class="resume" id="resumeInfo" hidden><span id="resumeText"></span> · <button class="link" id="restartBtn" type="button">Start over</button></span>
        <span id="nowInfo"></span>
      </div>
    </section>

    <section class="library">
      <div class="lib-head"><h2>Library</h2><span id="libInfo"></span></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="libEmpty" hidden>No videos yet. Paste a YouTube link to start.</p>
    </section>
  </main>
  <script src="./app.js?v=11"></script>
</body>
</html>
