<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ScoreLens Studio · Mobile</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f8f3e9;
      color: #161412;
      font-family: Avenir Next, Candara, Trebuchet MS, sans-serif;
    }

    .boot {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .boot-card {
      max-width: 420px;
      padding: 22px;
      border: 2px solid #161412;
      border-radius: 12px;
      background: #fffaf0;
      box-shadow: 6px 6px 0 #161412;
      font-weight: 800;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="boot">
    <div class="boot-card" id="bootStatus">Loading ScoreLens Studio…</div>
  </div>

  <script>
    const mobileCss = `
      @media (max-width: 900px) {
        body {
          overflow-x: hidden;
          -webkit-tap-highlight-color: transparent;
        }

        .app {
          width: min(100% - 20px, 760px) !important;
          padding: 10px 0 calc(26px + env(safe-area-inset-bottom)) !important;
        }

        .topbar {
          grid-template-columns: 1fr !important;
          align-items: stretch !important;
          gap: 12px !important;
          padding: 8px 0 12px !important;
        }

        .workspace {
          display: flex !important;
          flex-direction: column !important;
          gap: 14px !important;
          padding-top: 12px !important;
        }

        .stage {
          order: 1;
          width: 100%;
        }

        .rail {
          order: 2;
          position: static !important;
          width: 100%;
        }

        .inspector {
          order: 3;
          position: static !important;
          width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }

        .inspector .panel:nth-child(2),
        .inspector .panel:nth-child(3) {
          grid-column: 1 / -1;
        }

        .viewer {
          min-height: 360px !important;
          max-height: 68dvh;
          overflow: auto !important;
          overscroll-behavior: contain;
          box-shadow: 5px 5px 0 rgba(22, 20, 18, .95) !important;
        }

        #scoreCanvas {
          min-width: 0 !important;
          min-height: 0 !important;
          width: 100% !important;
          height: auto !important;
        }

        .status {
          align-items: stretch !important;
        }

        .meter {
          width: min(320px, 100%) !important;
        }
      }

      @media (max-width: 600px) {
        body {
          background: var(--paper);
        }

        .app {
          width: 100% !important;
          padding: 0 0 calc(22px + env(safe-area-inset-bottom)) !important;
        }

        .topbar {
          position: sticky;
          top: 0;
          z-index: 30;
          padding: calc(8px + env(safe-area-inset-top)) 12px 10px !important;
          background: rgba(248, 243, 233, .96);
          border-bottom-width: 2px !important;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }

        .brand {
          align-items: center !important;
          gap: 10px !important;
        }

        .mark {
          width: 40px !important;
          height: 40px !important;
          font-size: 25px !important;
          box-shadow: 3px 3px 0 var(--gold) !important;
        }

        h1 {
          font-size: clamp(25px, 8vw, 34px) !important;
          line-height: .95 !important;
        }

        .subtitle {
          display: none !important;
        }

        .version {
          margin-top: 5px !important;
          padding: 2px 6px !important;
          font-size: 10px !important;
        }

        .transport {
          display: grid !important;
          grid-template-columns: 48px minmax(0, 1fr) 48px minmax(0, 1fr);
          gap: 8px !important;
          width: 100%;
          justify-content: stretch !important;
        }

        .transport .icon-btn,
        .transport .command,
        .transport .file-label {
          min-height: 48px !important;
          margin: 0 !important;
          box-shadow: 2px 2px 0 var(--ink) !important;
        }

        .transport .icon-btn {
          width: 48px !important;
        }

        .transport .command,
        .transport .file-label {
          justify-content: center;
          padding-inline: 10px !important;
        }

        .workspace {
          gap: 12px !important;
          padding: 10px 10px 0 !important;
        }

        .panel {
          box-shadow: 0 8px 24px rgba(42, 30, 18, .10) !important;
        }

        .panel-head {
          min-height: 42px;
          padding: 9px 11px !important;
        }

        .panel-head .icon-btn {
          width: 36px !important;
          min-height: 34px !important;
          box-shadow: none !important;
        }

        .panel-body {
          padding: 11px !important;
        }

        .viewer {
          min-height: 285px !important;
          max-height: 62dvh;
          border-radius: 6px !important;
          box-shadow: 3px 3px 0 rgba(22, 20, 18, .95) !important;
        }

        #scoreCanvas {
          display: block;
          width: 100% !important;
          max-width: none !important;
        }

        .drop-hint {
          inset: 10px !important;
          padding: 14px !important;
          font-size: 13px;
        }

        .drop-hint strong {
          font-size: 24px !important;
          line-height: 1.05;
        }

        .status {
          display: grid !important;
          grid-template-columns: 1fr !important;
          gap: 8px !important;
          padding: 0 2px;
          font-size: 12px !important;
        }

        .meter {
          width: 100% !important;
        }

        .rail .panel:first-child .panel-body {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .rail .panel:first-child .field {
          min-width: 0;
          margin-bottom: 0 !important;
        }

        .rail .panel:first-child .field:first-child,
        .rail .panel:first-child .toggles {
          grid-column: 1 / -1;
        }

        .rail .panel:nth-child(2) {
          display: none;
        }

        .segmented button,
        select,
        input[type="number"] {
          min-height: 44px !important;
        }

        input[type="range"] {
          min-height: 36px;
        }

        .toggle {
          min-height: 44px;
          padding: 8px 9px !important;
          font-size: 12px !important;
        }

        .toggle input {
          width: 22px !important;
          height: 22px !important;
        }

        .inspector {
          display: grid !important;
          grid-template-columns: 1fr !important;
          gap: 12px !important;
        }

        .inspector .panel {
          grid-column: 1 !important;
        }

        .inspector .panel:first-child .panel-body {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .inspector .panel:first-child .field {
          margin-bottom: 0 !important;
          min-width: 0;
        }

        .inspector .panel:first-child .legend {
          grid-column: 1 / -1;
        }

        .note-list {
          max-height: 300px !important;
          padding-right: 0 !important;
        }

        .note-row {
          grid-template-columns: 44px minmax(76px, 1fr) 82px !important;
          gap: 6px !important;
          padding: 7px !important;
        }

        .note-row input,
        .note-row select {
          min-height: 42px !important;
          padding: 6px !important;
        }

        textarea {
          min-height: 126px !important;
          font-size: 16px !important;
        }

        #applyTextBtn {
          width: 100%;
          min-height: 46px;
          justify-content: center;
        }

        .footer {
          margin: 14px 12px 0 !important;
          font-size: 11px !important;
        }
      }

      @media (max-width: 380px) {
        .topbar {
          padding-inline: 9px !important;
        }

        h1 {
          font-size: 24px !important;
        }

        .transport {
          grid-template-columns: 44px minmax(0, 1fr) 44px minmax(0, 1fr);
          gap: 6px !important;
        }

        .transport .icon-btn {
          width: 44px !important;
        }

        .workspace {
          padding-inline: 7px !important;
        }

        .rail .panel:first-child .panel-body {
          grid-template-columns: 1fr;
        }

        .rail .panel:first-child .field:first-child,
        .rail .panel:first-child .toggles {
          grid-column: 1;
        }
      }
    `;

    async function loadApp() {
      const bootStatus = document.getElementById('bootStatus');
      try {
        const response = await fetch('./index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();

        html = html.replace(
          '</head>',
          `<style id="mobile-first-layout">${mobileCss}</style></head>`
        );
        html = html.replaceAll('v2026.07.31-soundfont.2', 'v2026.09.04-mobile.1');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        bootStatus.textContent = 'Could not load the main ScoreLens app. Refresh the page or open index.html directly. ' + error.message;
      }
    }

    loadApp();
  </script>
</body>
</html>
